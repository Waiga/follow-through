name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the test suite
        run: python -m unittest discover -s tests -t . -v

  install:
    name: Clean install and documented example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install from source with no dependencies
        run: python -m pip install --no-deps .
      - name: Run the example exactly as the README documents it
        run: |
          follow-through --version
          follow-through extract examples/weekly-sync.txt
          follow-through track examples/weekly-sync.txt
          follow-through list
          follow-through report
          test -f reports/follow-through.md
          test -f reports/follow-through.html
