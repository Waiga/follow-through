[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "follow-through"
version = "0.2.1"
description = "Find the commitments in a transcript and track them until they are closed. Runs entirely on your machine."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Waiga Arya" }]
keywords = ["transcripts", "meetings", "commitments", "accountability", "cli", "offline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Waiga/follow-through"
Issues = "https://github.com/Waiga/follow-through/issues"

[project.scripts]
follow-through = "follow_through.cli:main"

[tool.setuptools]
packages = ["follow_through"]
